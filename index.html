<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git ハンズオン 進捗</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --line: #2a2f3a;
    --text: #eef1f6;
    --muted: #8b93a3;
    --gray: #5c6372;
    --green: #3ecf8e;
    --amber: #f5b83d;
    --blue: #5aa9ff;
    --red: #ff5d5d;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    padding: 28px 36px 64px;
    min-height: 100vh;
  }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 34px; margin: 0; letter-spacing: .02em; }
  .updated { color: var(--muted); font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
  .dot.stale { background: var(--red); }
  .dot.busy { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .stats { display: flex; gap: 12px; margin: 24px 0 14px; flex-wrap: wrap; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 20px; min-width: 140px; border-top: 4px solid var(--c);
  }
  .stat b { display: block; font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 16px; }

  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); margin-bottom: 28px; }
  .bar div { background: var(--c); transition: flex-grow .6s ease; }

  .error {
    display: none; background: #3a1717; border: 1px solid var(--red); color: #ffc9c9;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 15px; white-space: pre-wrap;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--c);
    border-radius: 12px; padding: 16px 18px; min-width: 0;
  }
  .card.NO_BRANCH { border-style: dashed; border-left-style: solid; opacity: .55; }
  .card.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 4px var(--c); transform: scale(1.03); } 100% { box-shadow: 0 0 0 0 transparent; transform: none; } }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .id { font-family: var(--mono); font-size: 28px; font-weight: 700; }
  .pill {
    font-size: 15px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
    color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); white-space: nowrap;
  }
  .card .meta { color: var(--muted); font-size: 15px; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .note { color: var(--c); font-size: 15px; margin-top: 6px; overflow-wrap: anywhere; }
  .card pre {
    display: none; margin: 12px 0 0; padding: 10px 12px; background: var(--bg); border-radius: 8px;
    font-family: var(--mono); font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  body.show-content .card pre:not(:empty) { display: block; }

  .warn { color: var(--amber); font-size: 17px; margin-top: 24px; }
  .empty { color: var(--muted); font-size: 20px; padding: 40px 0; }

  footer {
    position: fixed; right: 20px; bottom: 14px; color: var(--gray); font-size: 13px;
  }
  kbd { font-family: var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
</style>
</head>
<body>
  <header>
    <h1>git ハンズオン 進捗</h1>
    <div class="updated"><span class="dot" id="dot"></span><span id="updated">読み込み中…</span></div>
  </header>

  <div class="stats" id="stats"></div>
  <div class="bar" id="bar"></div>
  <div class="error" id="error"></div>
  <div class="grid" id="grid"></div>
  <div class="warn" id="warn"></div>

  <footer><kbd>C</kbd> ファイルの中身 &nbsp; <kbd>F</kbd> 全画面</footer>

<script>
  const POLL_MS = 5000;

  // 表示順はこの並び (進んでいる順)
  const STATUS = {
    RESOLVED:     { label: "解決！",           color: "var(--blue)" },
    INJECTED:     { label: "コンフリクト待ち", color: "var(--amber)" },
    PUSHED:       { label: "push 済み",        color: "var(--green)" },
    MARKER_LEFT:  { label: "マーカー残り",     color: "var(--red)" },
    FORCE_PUSHED: { label: "force push",       color: "var(--red)" },
    NO_FILE:      { label: "ファイルなし",     color: "var(--red)" },
    NO_BRANCH:    { label: "未着手",           color: "var(--gray)" },
  };
  const PROBLEMS = ["MARKER_LEFT", "FORCE_PUSHED", "NO_FILE"];

  const $ = id => document.getElementById(id);
  const rtf = new Intl.RelativeTimeFormat("ja", { numeric: "auto" });
  let prev = {};
  let lastData = null;

  function ago(unix) {
    if (!unix) return "";
    const s = Math.round(unix - Date.now() / 1000);
    if (s > -60) return "たった今";
    if (s > -3600) return rtf.format(Math.round(s / 60), "minute");
    return rtf.format(Math.round(s / 3600), "hour");
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render(data) {
    lastData = data;
    const rows = data.rows;

    // 集計: 要対応はまとめて 1 つに
    const counts = {};
    for (const r of rows) {
      const k = PROBLEMS.includes(r.status) ? "PROBLEM" : r.status;
      counts[k] = (counts[k] || 0) + 1;
    }
    const groups = [
      ["RESOLVED", "解決", "var(--blue)"],
      ["INJECTED", "コンフリクト待ち", "var(--amber)"],
      ["PUSHED", "push 済み", "var(--green)"],
      ["PROBLEM", "要対応", "var(--red)"],
      ["NO_BRANCH", "未着手", "var(--gray)"],
    ].filter(([k]) => counts[k] || k === "PUSHED");

    const stat = (n, label, c) => {
      const s = el("div", "stat");
      s.style.setProperty("--c", c);
      s.append(el("b", null, n), el("span", null, label));
      return s;
    };
    $("stats").replaceChildren(
      stat(rows.length, "参加者", "var(--text)"),
      ...groups.map(([k, label, c]) => stat(counts[k] || 0, label, c))
    );

    $("bar").replaceChildren(...groups.map(([k, , c]) => {
      const d = el("div");
      d.style.setProperty("--c", c);
      d.style.flexGrow = counts[k] || 0;
      return d;
    }));

    // カード
    if (!rows.length) {
      $("grid").replaceChildren(el("div", "empty", "まだ誰も push していません"));
    } else {
      $("grid").replaceChildren(...rows.map(r => {
        const st = STATUS[r.status] || { label: r.status, color: "var(--red)" };
        const card = el("div", "card " + r.status);
        card.style.setProperty("--c", st.color);
        if (prev[r.id] && prev[r.id] !== r.status) card.classList.add("flash");

        const top = el("div", "top");
        top.append(el("span", "id", r.id), el("span", "pill", st.label));
        card.append(top);
        if (r.time) card.append(el("div", "meta", `${ago(r.time)} · ${r.subject}`));
        if (r.note && PROBLEMS.includes(r.status)) card.append(el("div", "note", r.note));
        card.append(el("pre", null, r.content));
        return card;
      }));
    }
    prev = Object.fromEntries(rows.map(r => [r.id, r.status]));

    const warn = [];
    if (data.odd.length) warn.push("学籍番号の形式でないブランチ: " + data.odd.join(", "));
    if (data.extra.length) warn.push("名簿にないブランチ: " + data.extra.join(", "));
    $("warn").textContent = warn.join("　/　");

    $("error").style.display = data.error ? "block" : "none";
    $("error").textContent = data.error ? "取得に失敗しました（前回の結果を表示中）\n" + data.error : "";
    $("dot").classList.toggle("stale", !!data.error);
    $("updated").textContent = new Date(data.updated * 1000).toLocaleTimeString("ja-JP") + " 更新";
  }

  async function poll() {
    $("dot").classList.add("busy");
    try {
      const res = await fetch("/api/status");
      render(await res.json());
    } catch (e) {
      $("dot").classList.add("stale");
      $("updated").textContent = "サーバーに接続できません";
    } finally {
      $("dot").classList.remove("busy");
      setTimeout(poll, POLL_MS);
    }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "c" || e.key === "C") document.body.classList.toggle("show-content");
    if (e.key === "f" || e.key === "F") {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    }
  });

  poll();
</script>
</body>
</html>
