<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git ハンズオン 進捗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Mono:wght@400;700&display=swap">
<style>
  /* デジタル庁デザインシステム (DADS) に準拠
     色: プリミティブカラー / セマンティックカラー、余白: 8px 基準、書体: Noto Sans JP / Noto Sans Mono */
  :root {
    --white: #ffffff;
    --gray-50: #f2f2f2;
    --gray-420: #949494;   /* 白に対して 3:1 (枠線) */
    --gray-600: #666666;   /* 白に対して 4.5:1 以上 (補足テキスト) */
    --gray-900: #1a1a1a;   /* 本文 */
    --black: #000000;
    --yellow-300: #ffd43d; /* フォーカスインジケーター */

    --blue-50: #e8f1fe;   --blue-900: #0031d8;
    --green-50: #e6f5ec;  --green-600: #259d63;  --green-800: #197a4b;
    --orange-50: #ffeee2; --orange-600: #fb5b01; --orange-900: #ac3e00;
    --red-50: #fdeeee;    --red-800: #ec0000;    --red-900: #ce0000;

    --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-5: 40px;
    --radius-s: 8px; --radius-m: 12px;

    --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    --mono: "Noto Sans Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--white);
    color: var(--gray-900);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.7;
    padding: var(--sp-3) var(--sp-5) 64px;
    min-height: 100vh;
  }

  /* ヘッダー: Std-32B-150 */
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); flex-wrap: wrap;
    padding-bottom: var(--sp-2); border-bottom: 1px solid var(--gray-420);
  }
  h1 { font-size: 32px; line-height: 1.5; font-weight: 700; letter-spacing: .01em; margin: 0; }
  .updated { color: var(--gray-600); font-size: 16px; display: flex; align-items: center; gap: var(--sp-1); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--green-600); }
  .dot.stale { background: var(--red-800); }
  .dot.busy { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* 集計 */
  .stats { display: flex; gap: var(--sp-2); margin: var(--sp-3) 0 var(--sp-2); flex-wrap: wrap; }
  .stat {
    border: 1px solid var(--gray-420); border-radius: var(--radius-m); background: var(--white);
    padding: var(--sp-1) var(--sp-3) var(--sp-2); min-width: 150px; border-top: 6px solid var(--c);
  }
  .stat b { display: block; font-size: 48px; line-height: 1.4; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 17px; font-weight: 700; }

  .bar {
    display: flex; height: 16px; border-radius: var(--radius-s); overflow: hidden;
    background: var(--gray-50); border: 1px solid var(--gray-420); margin-bottom: var(--sp-3);
  }
  .bar div { background: var(--c); transition: flex-grow .6s ease; }
  .bar div + div { border-left: 2px solid var(--white); }

  /* ノティフィケーションバナー (エラー) */
  .error {
    display: none; border: 2px solid var(--red-800); background: var(--red-50); border-radius: var(--radius-m);
    padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-3);
  }
  .error strong { color: var(--red-900); display: block; font-size: 18px; }
  .error pre { margin: var(--sp-1) 0 0; font-family: var(--mono); font-size: 15px; white-space: pre-wrap; }

  /* カード: 外周 (枠線) をもつ */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--sp-2); }
  .card {
    background: var(--white); border: 1px solid var(--gray-420); border-radius: var(--radius-m);
    padding: var(--sp-2) var(--sp-3); min-width: 0;
  }
  .card.NO_BRANCH { background: var(--gray-50); border-style: dashed; }
  .card.flash { animation: flash 2s ease-out; }
  @keyframes flash { 0% { background: var(--blue-50); outline: 4px solid var(--blue-900); } 100% { outline: 4px solid transparent; } }
  @media (prefers-reduced-motion: reduce) { .card.flash, .dot.busy { animation: none; } }

  .card .top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-1); }
  .card .id { font-family: var(--mono); font-size: 28px; line-height: 1.5; font-weight: 700; }
  .card .meta { color: var(--gray-600); font-size: 16px; margin-top: var(--sp-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .note { color: var(--red-900); font-size: 16px; font-weight: 700; margin-top: var(--sp-1); overflow-wrap: anywhere; }
  .card pre {
    display: none; margin: var(--sp-2) 0 0; padding: var(--sp-1) var(--sp-2);
    background: var(--gray-50); border-radius: var(--radius-s);
    font-family: var(--mono); font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  body.show-content .card pre:not(:empty) { display: block; }

  /* チップラベル: 枠線 + 淡い背景 + 記号 + テキスト (色だけで伝えない) */
  .chip {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 16px; line-height: 1; font-weight: 700; padding: 6px 12px;
    border: 1px solid var(--chip-line); background: var(--chip-bg); color: var(--chip-text); border-radius: var(--radius-s);
  }
  .chip .mark { font-family: var(--mono); }

  .warn {
    margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-3); border: 1px solid var(--orange-600);
    background: var(--orange-50); border-radius: var(--radius-m); color: var(--orange-900); font-weight: 700;
  }
  .warn:empty { display: none; }
  .empty { color: var(--gray-600); font-size: 20px; padding: var(--sp-5) 0; }

  /* 表示切り替え */
  .tabs { display: flex; gap: 0; }
  .tabs button {
    font: inherit; font-size: 17px; font-weight: 700; line-height: 1; cursor: pointer;
    padding: 12px var(--sp-3); border: 1px solid var(--blue-900); background: var(--white); color: var(--blue-900);
  }
  .tabs button:first-child { border-radius: var(--radius-s) 0 0 var(--radius-s); }
  .tabs button:last-child { border-radius: 0 var(--radius-s) var(--radius-s) 0; border-left: 0; }
  .tabs button[aria-pressed="true"] { background: var(--blue-900); color: var(--white); }
  .tabs button:focus-visible { outline: 4px solid var(--black); outline-offset: 2px; box-shadow: 0 0 0 2px var(--yellow-300); }
  .head-right { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }

  /* 自己紹介 */
  .intro-count { font-size: 20px; font-weight: 700; margin: var(--sp-3) 0 var(--sp-2); }
  .intro-count span { color: var(--gray-600); font-weight: 400; font-size: 17px; }
  .intros { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--sp-2); }
  .intro {
    border: 1px solid var(--gray-420); border-radius: var(--radius-m); background: var(--white);
    padding: var(--sp-2) var(--sp-3) var(--sp-3); min-width: 0;
  }
  .intro .who { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-1); flex-wrap: wrap; }
  .intro .name { font-size: 26px; line-height: 1.5; font-weight: 700; overflow-wrap: anywhere; }
  .intro .name.blank { color: var(--gray-600); font-weight: 400; font-size: 20px; }
  .intro .sid { font-family: var(--mono); font-size: 16px; color: var(--gray-600); }
  .intro .word {
    margin: var(--sp-1) 0 0; font-size: 22px; line-height: 1.5; overflow-wrap: anywhere;
    padding-left: var(--sp-2); border-left: 4px solid var(--blue-900);
  }
  .intro dl { margin: var(--sp-2) 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px var(--sp-2); font-size: 17px; }
  .intro dt { color: var(--gray-600); }
  .intro dd { margin: 0; overflow-wrap: anywhere; }
  .intro .extra { margin: var(--sp-1) 0 0; font-size: 17px; overflow-wrap: anywhere; }

  footer { position: fixed; right: var(--sp-3); bottom: var(--sp-2); color: var(--gray-600); font-size: 14px; background: var(--white); }
  kbd { font-family: var(--mono); border: 1px solid var(--gray-420); border-radius: 4px; padding: 0 6px; }
</style>
</head>
<body>
  <header>
    <h1 id="title">git ハンズオン 進捗</h1>
    <div class="head-right">
      <div class="tabs">
        <button type="button" data-view="progress" aria-pressed="true">進捗</button>
        <button type="button" data-view="intro" aria-pressed="false">自己紹介</button>
      </div>
      <div class="updated"><span class="dot" id="dot" aria-hidden="true"></span><span id="updated">読み込み中…</span></div>
    </div>
  </header>

  <div class="error" id="error" role="alert" style="margin-top: var(--sp-3)"><strong>取得に失敗しました（前回の結果を表示中）</strong><pre id="error-msg"></pre></div>

  <section id="view-progress">
    <div class="stats" id="stats"></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="grid" id="grid"></div>
    <div class="warn" id="warn"></div>
  </section>

  <section id="view-intro" hidden>
    <div class="intro-count" id="intro-count"></div>
    <div class="intros" id="intros"></div>
  </section>

  <footer><kbd>1</kbd> 進捗 &nbsp; <kbd>2</kbd> 自己紹介 &nbsp; <kbd>C</kbd> ファイルの中身 &nbsp; <kbd>F</kbd> 全画面</footer>

<script>
  const POLL_MS = 5000;

  // チップラベルの配色 (DADS のチップラベル例: 開始前=グレー / 作業中=青 / 完了=緑 / 保留=黄・橙 / 中止=赤)
  const TONE = {
    gray:   { text: "var(--gray-600)",   line: "var(--gray-420)",   bg: "var(--white)",     bar: "var(--gray-420)" },
    blue:   { text: "var(--blue-900)",   line: "var(--blue-900)",   bg: "var(--blue-50)",   bar: "var(--blue-900)" },
    orange: { text: "var(--orange-900)", line: "var(--orange-600)", bg: "var(--orange-50)", bar: "var(--orange-600)" },
    green:  { text: "var(--green-800)",  line: "var(--green-600)",  bg: "var(--green-50)",  bar: "var(--green-600)" },
    red:    { text: "var(--red-900)",    line: "var(--red-800)",    bg: "var(--red-50)",    bar: "var(--red-800)" },
  };
  const STATUS = {
    RESOLVED:     { label: "解決",             mark: "✓", tone: "green" },
    INJECTED:     { label: "コンフリクト対応中", mark: "…", tone: "orange" },
    PUSHED:       { label: "push 済み",        mark: "↑", tone: "blue" },
    MARKER_LEFT:  { label: "マーカー残り",     mark: "!", tone: "red" },
    FORCE_PUSHED: { label: "force push",       mark: "!", tone: "red" },
    NO_FILE:      { label: "ファイルなし",     mark: "!", tone: "red" },
    NO_BRANCH:    { label: "未着手",           mark: "–", tone: "gray" },
  };
  const PROBLEMS = ["MARKER_LEFT", "FORCE_PUSHED", "NO_FILE"];
  // 集計の並び (進んでいる順)。要対応はまとめて 1 つ
  const GROUPS = [
    ["RESOLVED", "解決", "green"],
    ["INJECTED", "コンフリクト対応中", "orange"],
    ["PUSHED", "push 済み", "blue"],
    ["PROBLEM", "要対応", "red"],
    ["NO_BRANCH", "未着手", "gray"],
  ];

  const $ = id => document.getElementById(id);
  const rtf = new Intl.RelativeTimeFormat("ja", { numeric: "auto" });
  let prev = {};

  function ago(unix) {
    if (!unix) return "";
    const s = Math.round(unix - Date.now() / 1000);
    if (s > -60) return "たった今";
    if (s > -3600) return rtf.format(Math.round(s / 60), "minute");
    return rtf.format(Math.round(s / 3600), "hour");
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function chip(st) {
    const t = TONE[st.tone];
    const c = el("span", "chip");
    c.style.setProperty("--chip-text", t.text);
    c.style.setProperty("--chip-line", t.line);
    c.style.setProperty("--chip-bg", t.bg);
    c.append(el("span", "mark", st.mark), st.label);
    return c;
  }

  function render(data) {
    const rows = data.rows;

    const counts = {};
    for (const r of rows) {
      const k = PROBLEMS.includes(r.status) ? "PROBLEM" : r.status;
      counts[k] = (counts[k] || 0) + 1;
    }
    const groups = GROUPS.filter(([k]) => counts[k] || k === "PUSHED");

    const stat = (n, label, color) => {
      const s = el("div", "stat");
      s.style.setProperty("--c", color);
      s.append(el("b", null, n), el("span", null, label));
      return s;
    };
    $("stats").replaceChildren(
      stat(rows.length, "参加者", "var(--gray-900)"),
      ...groups.map(([k, label, tone]) => stat(counts[k] || 0, label, TONE[tone].bar))
    );
    $("bar").replaceChildren(...groups.map(([k, , tone]) => {
      const d = el("div");
      d.style.setProperty("--c", TONE[tone].bar);
      d.style.flexGrow = counts[k] || 0;
      return d;
    }));

    if (!rows.length) {
      $("grid").replaceChildren(el("div", "empty", "まだ誰も push していません"));
    } else {
      $("grid").replaceChildren(...rows.map(r => {
        const st = STATUS[r.status] || { label: r.status, mark: "!", tone: "red" };
        const card = el("div", "card " + r.status);
        if (prev[r.id] && prev[r.id] !== r.status) card.classList.add("flash");

        const top = el("div", "top");
        top.append(el("span", "id", r.id), chip(st));
        card.append(top);
        if (r.time) card.append(el("div", "meta", `${ago(r.time)} · ${r.subject}`));
        if (r.note && PROBLEMS.includes(r.status)) card.append(el("div", "note", r.note));
        card.append(el("pre", null, r.content));
        return card;
      }));
    }
    prev = Object.fromEntries(rows.map(r => [r.id, r.status]));

    renderIntro(rows);

    const warn = [];
    if (data.odd.length) warn.push("学籍番号の形式でないブランチ: " + data.odd.join(", "));
    if (data.extra.length) warn.push("名簿にないブランチ: " + data.extra.join(", "));
    $("warn").textContent = warn.join("　/　");

    $("error").style.display = data.error ? "block" : "none";
    $("error-msg").textContent = data.error || "";
    $("dot").classList.toggle("stale", !!data.error);
    $("updated").textContent = new Date(data.updated * 1000).toLocaleTimeString("ja-JP") + " 更新";
  }

  // 「名前: 〜」形式の行を項目に、それ以外の行を本文として取り出す。見出し (# 学籍番号) は捨てる
  // コンフリクトマーカーが残っていたら本人側 (HEAD 側) だけを使う
  function parseIntro(text) {
    const fields = [], lines = [];
    let theirs = false;
    for (const raw of text.split(/\r?\n/)) {
      if (/^<<<<<<< /.test(raw)) continue;
      if (/^=======\s*$/.test(raw)) { theirs = true; continue; }
      if (/^>>>>>>> /.test(raw)) { theirs = false; continue; }
      if (theirs) continue;
      const line = raw.trim();
      if (!line || /^#/.test(line)) continue;
      const m = line.match(/^(?:[-*]\s*)?([^:：]{1,20})[:：]\s*(.*)$/);
      if (m) fields.push([m[1].trim(), m[2].trim()]);
      else lines.push(line.replace(/^[-*]\s+/, ""));
    }
    return { fields, lines };
  }

  function renderIntro(rows) {
    const written = rows.filter(r => r.intro);
    $("intro-count").replaceChildren("自己紹介 ", el("span", null, `${rows.length} 人中 ${written.length} 人`));

    if (!written.length) {
      $("intros").replaceChildren(el("div", "empty", "まだ誰も push していません"));
      return;
    }
    $("intros").replaceChildren(...written.map(r => {
      const { fields, lines } = parseIntro(r.intro);
      const take = key => {
        const i = fields.findIndex(([k]) => k === key);
        return i < 0 ? "" : fields.splice(i, 1)[0][1];
      };
      const name = take("名前");
      const word = take("ひとこと");

      const card = el("article", "intro");
      const who = el("div", "who");
      who.append(el("span", "name" + (name ? "" : " blank"), name || "（名前なし）"), el("span", "sid", r.id));
      card.append(who);
      if (word) card.append(el("p", "word", word));
      if (fields.length) {
        const dl = el("dl");
        for (const [k, v] of fields) dl.append(el("dt", null, k), el("dd", null, v));
        card.append(dl);
      }
      for (const line of lines) card.append(el("p", "extra", line));
      return card;
    }));
  }

  function setView(view) {
    if (view !== "intro") view = "progress";
    $("view-progress").hidden = view !== "progress";
    $("view-intro").hidden = view !== "intro";
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === view));
    $("title").textContent = view === "intro" ? "git ハンズオン 自己紹介" : "git ハンズオン 進捗";
    history.replaceState(null, "", view === "intro" ? "#intro" : "#");
  }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
  setView(location.hash.slice(1));

  async function poll() {
    $("dot").classList.add("busy");
    try {
      const res = await fetch("/api/status");
      render(await res.json());
    } catch (e) {
      $("dot").classList.add("stale");
      $("updated").textContent = "サーバーに接続できません";
    } finally {
      $("dot").classList.remove("busy");
      setTimeout(poll, POLL_MS);
    }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "1") setView("progress");
    if (e.key === "2") setView("intro");
    if (e.key === "c" || e.key === "C") document.body.classList.toggle("show-content");
    if (e.key === "f" || e.key === "F") {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    }
  });

  poll();
</script>
</body>
</html>
